name: Release

# Triggered when you push a tag like v0.3.0.
# Builds a universal (arm64 + x86_64) macOS binary, packages it as
# .tar.gz, computes a SHA-256 checksum, and creates a GitHub Release
# with both files attached.
#
# To cut a release:
#     git tag v0.3.0
#     git push origin v0.3.0
#
# To rebuild without bumping the version (rare): re-tag and force-push.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed for `gh release create`

jobs:
  build-and-release:
    # macos-15 ships Xcode 16.x by default, which is required by
    # swift-tools-version:6.0 in Package.swift. macos-14 only has Xcode 15.x
    # which fails at parse time with "package manifest at '/Package.swift'
    # cannot be opened: tools-version (6.0) is greater than ...".
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          # refs/tags/v0.3.0 -> 0.3.0
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION"

      - name: Inject version into source
        # Bake the tag version into FigmaMCPServer so the binary self-reports
        # the same version users see on the release page. Sed pattern matches
        # any current literal so the workflow keeps working after future bumps.
        run: |
          FILE="Sources/MCPFigmaServer/Server/FigmaMCPServer.swift"
          sed -i '' -E "s/version: \"[0-9]+\.[0-9]+\.[0-9]+\"/version: \"${{ steps.version.outputs.version }}\"/" "$FILE"
          grep "version:" "$FILE" | head -3

      - name: Select latest Xcode 16+
        # Prefer the newest Xcode 16.x or 17.x present on the runner.
        # Falls back to the runner default Xcode.app if no versioned bundle is found.
        run: |
          BEST=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_17*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$BEST" ]; then
            BEST="/Applications/Xcode.app"
          fi
          echo "Using $BEST"
          sudo xcode-select -s "$BEST/Contents/Developer"

      - name: Show Swift version
        run: swift --version

      - name: Build arm64
        run: swift build -c release --arch arm64

      - name: Build x86_64
        run: swift build -c release --arch x86_64

      - name: Combine into universal binary
        run: |
          mkdir -p dist
          lipo -create -output dist/mcp-figma \
            .build/arm64-apple-macosx/release/mcp-figma \
            .build/x86_64-apple-macosx/release/mcp-figma
          strip dist/mcp-figma
          chmod +x dist/mcp-figma
          file dist/mcp-figma
          ls -lh dist/mcp-figma

      - name: Smoke test
        # Static checks only — proving the binary is a real universal Mach-O
        # with both slices, and that the tag version was sed-injected into
        # source before build. We avoid stdio runtime checks because piping
        # `printf | binary | head -1` races against MCP server startup and
        # is flaky on CI; the real end-to-end test happens when users install.
        run: |
          file dist/mcp-figma
          file dist/mcp-figma | grep -q "universal binary" \
            || { echo "FAIL: not a universal binary"; exit 1; }
          file dist/mcp-figma | grep -q "for architecture arm64" \
            || { echo "FAIL: missing arm64 slice"; exit 1; }
          file dist/mcp-figma | grep -q "for architecture x86_64" \
            || { echo "FAIL: missing x86_64 slice"; exit 1; }
          grep -q "version: \"${{ steps.version.outputs.version }}\"" Sources/MCPFigmaServer/Server/FigmaMCPServer.swift \
            || { echo "FAIL: version v${{ steps.version.outputs.version }} not injected into source"; exit 1; }
          echo "OK: universal binary with both slices, source injected with v${{ steps.version.outputs.version }}"

      - name: Package archive + checksum
        run: |
          cd dist
          tar -czf "mcp-figma-${{ steps.version.outputs.version }}-darwin-universal.tar.gz" mcp-figma
          shasum -a 256 "mcp-figma-${{ steps.version.outputs.version }}-darwin-universal.tar.gz" \
            > "mcp-figma-${{ steps.version.outputs.version }}-darwin-universal.tar.gz.sha256"
          ls -lh

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            "dist/mcp-figma-${{ steps.version.outputs.version }}-darwin-universal.tar.gz" \
            "dist/mcp-figma-${{ steps.version.outputs.version }}-darwin-universal.tar.gz.sha256"
